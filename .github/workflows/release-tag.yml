name: Auto-tag Release Commits

on:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  actions: write
  contents: write
  id-token: write

env:
  # Use the release bot token so tag/release pushes trigger normal workflow fanout.
  RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

concurrency:
  group: release-tag-${{ github.event.pull_request.number || inputs.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Validate release token
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error title=Missing RELEASE_TOKEN::Configure the release bot token as the RELEASE_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.event.pull_request.merge_commit_sha }}
          token: ${{ env.RELEASE_TOKEN }}

      - name: Determine release tag
        id: release
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --tags origin

          if [ -n "${INPUT_TAG_NAME}" ]; then
            if ! printf '%s\n' "${INPUT_TAG_NAME}" | grep -Eq '^v[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{2}$'; then
              echo "Release tag is not a valid release tag: ${INPUT_TAG_NAME}"
              exit 1
            fi

            tag_name="${INPUT_TAG_NAME}"
          else
            if ! printf '%s\n' "${PR_TITLE}" | grep -Eq '^chore\(release\): v[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{2}$'; then
              echo "Release PR title is not a valid release title: ${PR_TITLE}"
              exit 1
            fi

            tag_name="$(printf '%s\n' "${PR_TITLE}" | sed -E 's/^chore\(release\): (v[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]{2})$/\1/')"
          fi

          changelog_version="${tag_name#v}"

          if ! grep -Eq "^## (${changelog_version}|\[${changelog_version}\])([[:space:]]|$)" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain an entry for ${changelog_version}"
            exit 1
          fi

          if git rev-parse "${tag_name}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.release.outputs.tag_exists == 'false'
        run: |
          git tag "${{ steps.release.outputs.tag_name }}"
          git push origin "${{ steps.release.outputs.tag_name }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Export release notes
        run: scripts/export-release-notes.sh "${{ steps.release.outputs.tag_name }}" RELEASE_NOTES.md

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::836356947314:role/ProdGHActionAccess
          aws-region: us-east-2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}
          PUBLISH_S3: "true"
