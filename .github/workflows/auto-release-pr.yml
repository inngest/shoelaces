name: Auto-create Release PR

on:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # Use the release bot token so release/next pushes and PR updates trigger normal workflow fanout.
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

concurrency:
  group: release-pr-master
  cancel-in-progress: true

jobs:
  create-release-pr:
    runs-on: depot-ubuntu-latest

    steps:
      - name: Validate release token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Missing RELEASE_TOKEN::Configure the release bot token as the RELEASE_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}

      - name: Skip release commits
        id: skip
        run: |
          if git log -1 --pretty=%s | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for unreleased commits
        if: steps.skip.outputs.skip == 'false'
        id: changes
        run: |
          git fetch --tags origin
          latest_tag="$(
            git for-each-ref --merged HEAD --sort=-v:refname --format='%(refname:short)' 'refs/tags/v*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"
          head_sha="$(git rev-parse HEAD)"
          head_short_sha="$(git rev-parse --short HEAD)"

          if [ -n "${latest_tag}" ]; then
            ahead="$(git rev-list --count "${latest_tag}"..HEAD)"
            compare_url="${{ github.server_url }}/${{ github.repository }}/compare/${latest_tag}...${head_sha}"
            compare_label="${latest_tag}...${head_short_sha}"
          else
            ahead="$(git rev-list --count HEAD)"
            compare_url=""
            compare_label=""
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"
          echo "compare_url=${compare_url}" >> "$GITHUB_OUTPUT"
          echo "compare_label=${compare_label}" >> "$GITHUB_OUTPUT"

          if [ "${ahead}" -eq 0 ]; then
            echo "No unreleased commits found"
          else
            echo "Found ${ahead} unreleased commits since ${latest_tag:-repo start}"
          fi

      - name: Install git-cliff
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Compute next release tag
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: next-version
        run: |
          git cliff \
            --bumped-version \
            --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            --ignore-tags '^v[0-9]{4}-' \
            --output RELEASE_VERSION

          tag_name="$(tr -d '[:space:]' < RELEASE_VERSION)"
          if ! printf '%s\n' "${tag_name}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "git-cliff produced an invalid release tag: ${tag_name}"
            exit 1
          fi

          echo "tag=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "Next release tag: ${tag_name}"

      - name: Generate changelog
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.next-version.outputs.tag }} --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+$' --ignore-tags '^v[0-9]{4}-'
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes preview
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.next-version.outputs.tag }} --strip header --tag-pattern '^v[0-9]+\.[0-9]+\.[0-9]+$' --ignore-tags '^v[0-9]{4}-'
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update release branch
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          branch="release/next"

          git checkout -B "${branch}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "Release branch already matches generated files"
          else
            git commit -m "chore(release): ${RELEASE_TAG}"
          fi

          git push --force-with-lease origin "${branch}"

      - name: Create PR body
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
          AHEAD: ${{ steps.changes.outputs.ahead }}
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
          COMPARE_URL: ${{ steps.changes.outputs.compare_url }}
          COMPARE_LABEL: ${{ steps.changes.outputs.compare_label }}
        run: |
          {
            cat <<EOF
          <!-- auto-release-pr -->
          ## Release

          This PR prepares \`${RELEASE_TAG}\`.

          EOF

            if [ -n "${COMPARE_URL}" ]; then
              printf -- '- Code difference since last tag: [%s](%s)\n' "${COMPARE_LABEL}" "${COMPARE_URL}"
            else
              printf -- '- Code difference since last tag: none\n'
            fi

            if [ -n "${LATEST_TAG}" ]; then
              printf -- '- Previous tag: `%s`\n' "${LATEST_TAG}"
            else
              printf -- '- Previous tag: none\n'
            fi

            cat <<EOF
          - Commits since last tag: ${AHEAD}
          - Source branch: \`release/next\`
          - Base branch: \`${{ github.event.repository.default_branch }}\`

          ## Notes Preview

          $(cat RELEASE_NOTES.md)
          EOF
          } > /tmp/release-pr-body.md

      - name: Find existing release PR
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: existing-pr
        run: |
          pr_number="$(gh pr list \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.existing-pr.outputs.pr_number == ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md

      - name: Update existing release PR
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.existing-pr.outputs.pr_number != ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.tag }}
        run: |
          gh pr edit "${{ steps.existing-pr.outputs.pr_number }}" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md
