name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Test
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run unit tests
        run: make test-race

  integration-test:
    name: Integration Test
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run integration tests
        run: make integration

  provisioning-render-validation:
    name: Provisioning Render Validation
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install provisioning validators
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cloud-init debconf
          uv sync --frozen --only-dev

      - name: Run rendered provisioning validation
        run: uv run make render-validation
        env:
          SHOELACES_REQUIRE_PROVISIONING_VALIDATORS: "1"

  build:
    name: Build
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check generated files
        run: make check-gen

      - name: Build Linux amd64 binary
        run: go build -o shoelaces ./cmd/shoelaces
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64

      - name: Check version flag
        run: ./shoelaces -version

  release-package:
    name: GoReleaser Dry Run
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'release/next' &&
      startsWith(github.event.pull_request.title, 'chore(release): v')
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release artifact shape
        run: |
          set -euo pipefail

          test -f dist/checksums.txt

          for target in \
            darwin_amd64.tar.gz \
            darwin_arm64.tar.gz \
            linux_amd64.tar.gz \
            linux_arm64.tar.gz \
            windows_amd64.zip \
            windows_arm64.zip
          do
            matches=(dist/shoelaces_*_"${target}")
            test "${#matches[@]}" -eq 1
            grep -F "$(basename "${matches[0]}")" dist/checksums.txt
          done

          linux_amd64_archive=(dist/shoelaces_*_linux_amd64.tar.gz)
          tar -tzf "${linux_amd64_archive[0]}" | grep -Fx shoelaces

      - uses: actions/upload-artifact@v4
        with:
          name: shoelaces-release-dry-run
          path: |
            dist/*
          retention-days: 7

  lint:
    name: Lint
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --verbose
