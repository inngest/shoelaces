name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binary
        run: go build -o shoelaces ./main.go
        env:
          CGO_ENABLED: "0"

  lint:
    name: Lint
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.2.1
          args: --verbose

