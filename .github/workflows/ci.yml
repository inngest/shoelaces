name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit Test
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run unit tests
        run: go test -race ./...

  build:
    name: Build
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Linux amd64 binary
        run: go build -o shoelaces ./cmd/shoelaces
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64

      - name: Check version flag
        run: ./shoelaces -version

  release-package:
    name: GoReleaser Dry Run
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release artifact shape
        run: |
          set -euo pipefail

          test -f dist/shoelaces.tar.gz
          test -f dist/checksums.txt
          tar -tzf dist/shoelaces.tar.gz | grep -Fx shoelaces
          grep -F "shoelaces.tar.gz" dist/checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: shoelaces-release-dry-run
          path: |
            dist/*
          retention-days: 7

  lint:
    name: Lint
    runs-on: depot-ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.2.1
          args: --verbose
