name: Build

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to create/use for a manual GitHub release test"
        required: false
        type: string
      publish_github_release:
        description: "Publish artifacts to a GitHub release"
        required: true
        default: true
        type: boolean
      publish_s3:
        description: "Publish artifacts to S3 release/latest prefixes"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.export.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set tag
        id: export
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
            if [[ -z "$TAG" ]]; then
              TAG="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            fi
          else
            ./scripts/release_tag
            TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally"
          else
            git tag "${TAG}"
          fi

          git push origin "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: [tag]
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - shoelaces
    permissions:
      id-token: write
      contents: write
    env:
      REVISION: ${{ needs.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REVISION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build ${{ matrix.artifact }} binary
        run: go build -o ${{ matrix.artifact }} ./main.go
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64

      - name: Create compressed package with checksums
        run: |
          set -euo pipefail
          mkdir artifacts

          tar -cvzf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          md5sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.md5
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          tar -tzf ${{ matrix.artifact }}.tar.gz | grep -Fx ${{ matrix.artifact }}

          mv ${{ matrix.artifact }}.tar.* artifacts

      - name: Publish GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "$REVISION" == test-* ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$REVISION" >/dev/null 2>&1; then
            gh release upload "$REVISION" artifacts/* --clobber
          else
            gh release create "$REVISION" artifacts/* \
              $prerelease_flag \
              --title "$REVISION" \
              --notes "Shoelaces release workflow test for ${GITHUB_SHA}."
          fi

      - name: Prep credentials
        if: ${{ github.event_name == 'push' || inputs.publish_s3 }}
        run: |
          echo "AWS_S3_BUCKET=inngest-artifacts" >> $GITHUB_ENV
          echo "AWS_ASSUME_ROLE=arn:aws:iam::836356947314:role/ProdGHActionAccess" >> $GITHUB_ENV

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'push' || inputs.publish_s3 }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ROLE }}
          aws-region: us-east-2

      - name: Sync artifacts to S3
        if: ${{ github.event_name == 'push' || inputs.publish_s3 }}
        run: |
          aws s3 sync --delete ./artifacts s3://${{ env.AWS_S3_BUCKET }}/${{ matrix.artifact }}/releases/${{ env.REVISION }}
          aws s3 sync --delete ./artifacts s3://${{ env.AWS_S3_BUCKET }}/${{ matrix.artifact }}/releases/latest

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          retention-days: 7
