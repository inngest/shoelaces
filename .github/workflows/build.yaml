name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to create/use for a manual GitHub release test"
        required: false
        type: string
      publish_github_release:
        description: "Publish artifacts to a GitHub release"
        required: true
        default: true
        type: boolean
      publish_s3:
        description: "Publish artifacts to S3 release/latest prefixes"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.export.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set tag
        id: export
        run: |
          set -euo pipefail

          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="test-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally"
          else
            git tag "${TAG}"
          fi

          git push origin "refs/tags/${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  release:
    needs: [tag]
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      REVISION: ${{ needs.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.REVISION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        if: ${{ inputs.publish_github_release }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run GoReleaser snapshot
        if: ${{ !inputs.publish_github_release }}
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish --skip=validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare S3-compatible artifact set
        run: |
          set -euo pipefail
          mkdir s3-artifacts

          test -f dist/shoelaces.tar.gz
          cp dist/shoelaces.tar.gz s3-artifacts/shoelaces.tar.gz
          md5sum s3-artifacts/shoelaces.tar.gz > s3-artifacts/shoelaces.tar.gz.md5
          sha256sum s3-artifacts/shoelaces.tar.gz > s3-artifacts/shoelaces.tar.gz.sha256
          tar -tzf s3-artifacts/shoelaces.tar.gz | grep -Fx shoelaces

      - name: Prep credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_s3 }}
        run: |
          echo "AWS_S3_BUCKET=inngest-artifacts" >> $GITHUB_ENV
          echo "AWS_ASSUME_ROLE=arn:aws:iam::836356947314:role/ProdGHActionAccess" >> $GITHUB_ENV

      - name: Configure AWS credentials
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_s3 }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ASSUME_ROLE }}
          aws-region: us-east-2

      - name: Sync artifacts to S3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_s3 }}
        run: |
          aws s3 sync --delete ./s3-artifacts s3://${{ env.AWS_S3_BUCKET }}/shoelaces/releases/${{ env.REVISION }}
          aws s3 sync --delete ./s3-artifacts s3://${{ env.AWS_S3_BUCKET }}/shoelaces/releases/latest

      - uses: actions/upload-artifact@v4
        with:
          name: shoelaces
          path: |
            dist/*
            s3-artifacts/*
          retention-days: 7
