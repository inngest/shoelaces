network:
  bindAddr: localhost:8081
data:
  dir: configs/data-dir/
template:
  extension: .slc
mappings:
  file: mappings.yaml
log:
  level: debug
  handler: dev

persistence:
  backend: sqlite
  path: runtime/shoelaces.db
  retention:
    events: 720h
    eventsSweepInterval: 24h
    bootSessions: 24h
    bootSessionsSweepInterval: 1h

tftp:
  enabled: true
  address: ":69"
  root: /var/lib/shoelaces/tftp
  readonly: true
  timeout: 5s
