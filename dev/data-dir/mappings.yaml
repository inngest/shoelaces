defaults:
  params:
    # Keep the development profile non-destructive by default.
    encrypt_home: "false"
    # Serial console output is useful when exercising generated boot configs.
    linuxargs: "console=ttyS0"
  repos:
    release: trixie

targets:
  # These targets use the embedded generic provisioning templates unless a local
  # .slc override is added under dev/data-dir.
  debian12:
    script: debian.ipxe
    label: Debian 12 Bookworm (oldstable)
    repos:
      release: bookworm

  debian13:
    script: debian.ipxe
    label: Debian 13 Trixie
    repos:
      release: trixie

  debian13-luks:
    script: debian.ipxe
    label: Debian 13 Trixie LUKS
    repos:
      release: trixie
    storage:
      mode: regular
      encryption:
        enabled: true
        passphrase:
          env: SHOELACES_DEV_LUKS_PASSPHRASE

  ubuntu2404:
    script: ubuntu-minimal.ipxe
    label: Ubuntu 24.04 LTS
    repos:
      release: noble

  centos8:
    script: centos.ipxe
    label: CentOS 8
    repos:
      release: "8"

networkMaps:
  - network: 127.0.0.1/32
    defaultTarget: debian13
    targets:
      - debian12
      - debian13
      - debian13-luks
      - ubuntu2404
      - centos8
    params:
      hostname: local-dev

  - network: 192.0.2.0/24
    targets:
      - debian12
      - debian13
      - debian13-luks
      - ubuntu2404
      - centos8

hostnameMaps:
  - hostname: '^debian13-dev$'
    defaultTarget: debian13
    targets:
      - debian13

  - hostname: '^debian13-luks-dev$'
    defaultTarget: debian13-luks
    targets:
      - debian13-luks

  - hostname: '^ubuntu24-dev$'
    defaultTarget: ubuntu2404
    targets:
      - ubuntu2404

  - hostname: '^centos8-dev$'
    defaultTarget: centos8
    targets:
      - centos8
