targets:
  ubuntu-minimal:
    script: ubuntu-minimal.ipxe

  coreos:
    script: coreos.ipxe

  coreos-staging:
    script: coreos.ipxe
    environment: staging

networkMaps:
  - network: 20.20.20.20/24
    defaultTarget: ubuntu-minimal
    targets:
      - ubuntu-minimal
    params:
      hostname: placeholder

hostnameMaps:
  - hostname: '(etcd|k8s)\d-m\d'
    defaultTarget: coreos
    targets:
      - coreos
    params:
      version: 1122.3.0
      cloudconfig: virtual

  - hostname: '(etcd|k8s)\d-m\d'
    defaultTarget: coreos
    targets:
      - coreos
    params:
      version: 1122.3.0
      cloudconfig: virtual

  - hostname: 'k8s1-4'
    defaultTarget: coreos-staging
    targets:
      - coreos-staging
    params:
      version: 1298.6.0
      cloudconfig: baremetal

  - hostname: 'k8s1-\d'
    defaultTarget: coreos
    targets:
      - coreos
    params:
      version: 1122.3.0
      cloudconfig: baremetal

  - hostname: 'k8s1-\d'
    defaultTarget: coreos
    targets:
      - coreos
    params:
      version: 1122.3.0
      cloudconfig: baremetal
