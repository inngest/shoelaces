version: "2"
sql:
  - engine: sqlite
    schema: persistence/sqlite/schema
    queries: persistence/sqlite/query
    gen:
      go:
        package: sqlitedb
        out: persistence/sqlite/db
        sql_package: database/sql
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
